<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070b">
<meta name="robots" content="noindex, nofollow">
<title>مبروك الفوز!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preload" as="image" href="prize.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08070b;
    --gold-1: #fff4c2;
    --gold-2: #ffd95a;
    --gold-3: #f2b632;
    --gold-4: #c8901a;
    --text: #fff8e1;
    --muted: rgba(255, 240, 200, .62);
    --danger: #ff8a7a;
    --gold-text: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 38%, var(--gold-3) 64%, var(--gold-4) 100%);
    --ease-back: cubic-bezier(.18, 1.25, .4, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }

  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 60% at 50% 32%, rgba(255, 196, 40, .16), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 115%, rgba(255, 170, 30, .12), transparent 65%),
      var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shared ---------- */
  .gold-text {
    background-image:
      linear-gradient(110deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%),
      var(--gold-text);
    background-size: 250% 100%, 100% 100%;
    background-position: -10% 0, 0 0;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 200, 40, .45)) drop-shadow(0 3px 2px rgba(0, 0, 0, .4));
    animation: shine 4s linear infinite;
  }
  @keyframes shine {
    0%   { background-position: -10% 0, 0 0; }
    55%, 100% { background-position: 110% 0, 0 0; }
  }

  .rays {
    position: fixed;
    left: 50%;
    top: 36%;
    width: 190vmax;
    height: 190vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255, 214, 90, .09) 0deg 5deg, transparent 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 52%);
    mask-image: radial-gradient(circle, #000 0%, transparent 52%);
    transform: translate(-50%, -50%);
    animation: spin 90s linear infinite;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
  .rays.on { opacity: 1; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 30;
  }

  /* ---------- intro ---------- */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: opacity .7s ease, transform .7s ease;
  }
  .intro.leaving { opacity: 0; transform: scale(1.06); }

  .beam {
    position: absolute;
    top: -12vh;
    width: 40vmax;
    height: 135vh;
    background: linear-gradient(180deg, rgba(255, 232, 130, .6), rgba(255, 210, 60, .14) 60%, transparent);
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
    filter: blur(16px);
    transform-origin: 50% 0;
    mix-blend-mode: screen;
    opacity: 0;
  }
  .beam-l { left: calc(10% - 20vmax); transform: rotate(-22deg); }
  .beam-r { right: calc(10% - 20vmax); transform: rotate(22deg); }
  .intro.play .beam-l { animation: fade-in .9s ease-out forwards, swing-l 3s ease-in-out infinite alternate; }
  .intro.play .beam-r { animation: fade-in .9s ease-out forwards, swing-r 3s ease-in-out infinite alternate; }
  @keyframes swing-l { from { transform: rotate(-12deg); } to { transform: rotate(-34deg); } }
  @keyframes swing-r { from { transform: rotate(12deg); } to { transform: rotate(34deg); } }
  @keyframes fade-in { to { opacity: 1; } }

  .burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 130vmin;
    height: 130vmin;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 248, 210, .95) 0%,
      rgba(255, 224, 100, .6) 16%,
      rgba(255, 190, 40, .2) 38%,
      transparent 66%);
    mix-blend-mode: screen;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  .intro.play .burst {
    animation: burst 1.5s cubic-bezier(.2, .8, .2, 1) .2s forwards, glow 2.4s ease-in-out 1.7s infinite alternate;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.25); opacity: .6; }
  }
  @keyframes glow {
    from { transform: translate(-50%, -50%) scale(1.25); opacity: .6; }
    to   { transform: translate(-50%, -50%) scale(1.1); opacity: .4; }
  }

  .intro-title {
    position: relative;
    font-family: 'El Messiri', 'Cairo', serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 14vw, 9rem);
    line-height: 1.35;
    text-align: center;
    padding: 0 16px;
    opacity: 0;
    transform: scale(.4) translateY(40px);
  }
  .intro.play .intro-title {
    animation: title-in 1.1s var(--ease-back) .45s forwards, shine 3s linear 1.4s infinite;
  }
  @keyframes title-in {
    0%   { opacity: 0; transform: scale(.4) translateY(40px); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }

  .popper {
    position: absolute;
    bottom: max(4vh, 18px);
    width: clamp(92px, 19vmin, 180px);
    aspect-ratio: 1;
    opacity: 0;
  }
  .popper svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .popper-l { left: max(3vw, 10px); transform: translate(-70px, 70px) rotate(-12deg); }
  .popper-r { right: max(3vw, 10px); transform: translate(70px, 70px) rotate(12deg); }
  .intro.play .popper { animation: popper-in .6s var(--ease-back) .55s forwards; }
  @keyframes popper-in { to { opacity: 1; transform: none; } }
  .popper.shake svg { animation: shake .35s ease-in-out; }
  .popper.popped svg { animation: pop .5s ease-out; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-7deg); }
    75% { transform: rotate(7deg); }
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    25%  { transform: scale(.8, 1.15) translate(-6px, 6px); }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ---------- main stage ---------- */
  .stage {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px 16px;
    visibility: hidden;
  }
  .stage.show { visibility: visible; }

  .panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .stage.show .panel-form > * {
    opacity: 0;
    animation: rise .8s var(--ease-back) forwards;
  }
  .stage.show .panel-form > :nth-child(2) { animation-delay: .1s; }
  .stage.show .panel-form > :nth-child(3) { animation-delay: .2s; }
  .stage.show .panel-form > :nth-child(4) { animation-delay: .32s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  .panel-form.leaving { animation: fade-away .45s ease forwards; }
  @keyframes fade-away { to { opacity: 0; transform: scale(.94); filter: blur(4px); } }

  .badge {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 35%, rgba(255, 220, 110, .22), rgba(255, 190, 40, .06) 70%);
    border: 1px solid rgba(255, 215, 110, .4);
    box-shadow: 0 0 40px rgba(255, 200, 40, .3), inset 0 0 22px rgba(255, 210, 80, .18);
    margin-bottom: 14px;
  }
  .badge svg { width: 54px; height: 54px; animation: float 3.2s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .panel-form h2 {
    font-family: 'El Messiri', 'Cairo', serif;
    font-size: clamp(2.3rem, 8vw, 3.4rem);
    font-weight: 700;
    line-height: 1.4;
  }
  .lead {
    color: var(--muted);
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    margin: 4px 0 26px;
  }

  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 30px 24px 24px;
    border-radius: 22px;
    text-align: right;
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .025));
    border: 1px solid rgba(255, 215, 110, .22);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55), 0 0 60px rgba(255, 190, 40, .06), inset 0 1px 0 rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 18%;
    right: 18%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
  }
  .card.shake-x { animation: shake-x .4s ease; }
  @keyframes shake-x {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field label {
    font-size: .9rem;
    font-weight: 700;
    letter-spacing: .03em;
    color: var(--gold-2);
  }
  .field input {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 215, 110, .22);
    background: rgba(8, 7, 11, .55);
    color: var(--text);
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder { color: rgba(255, 240, 200, .34); font-weight: 400; }
  .field input:focus {
    border-color: var(--gold-2);
    background: rgba(8, 7, 11, .75);
    box-shadow: 0 0 0 4px rgba(255, 210, 80, .14), 0 0 26px rgba(255, 200, 40, .16);
  }
  .field .err { display: none; color: var(--danger); font-size: .85rem; }
  .field.invalid input { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255, 120, 100, .12); }
  .field.invalid .err { display: block; }

  .btn {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 58px;
    margin-top: 6px;
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 800;
    color: #2b1d00;
    background: linear-gradient(135deg, #fff1a6 0%, #f8cf4f 30%, #e9a919 65%, #ffd968 100%);
    box-shadow: 0 10px 30px rgba(245, 180, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(140, 90, 0, .35);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent);
    transform: skewX(-20deg);
    animation: btn-shine 3.4s ease-in-out infinite;
  }
  @keyframes btn-shine {
    0%, 55% { left: -60%; }
    100%    { left: 130%; }
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(245, 180, 30, .5), inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(140, 90, 0, .35); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid rgba(255, 230, 140, .75); outline-offset: 3px; }
  .btn[disabled] { cursor: progress; filter: saturate(.8) brightness(.95); transform: none; }
  .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid rgba(43, 29, 0, .25);
    border-top-color: #2b1d00;
    animation: turn .8s linear infinite;
  }
  .btn.busy .spinner { display: block; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .form-error {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255, 110, 90, .1);
    border: 1px solid rgba(255, 120, 100, .35);
    color: #ffb8ad;
    font-size: .92rem;
    text-align: center;
  }

  /* ---------- prize ---------- */
  .panel-prize { position: relative; }
  .prize-glow {
    position: absolute;
    left: 50%;
    top: 42%;
    width: min(150vmin, 1100px);
    height: min(150vmin, 1100px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(255, 220, 100, .16) 0deg 6deg, transparent 6deg 16deg),
      radial-gradient(circle, rgba(255, 220, 100, .35), transparent 60%);
    -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 62%);
    mask-image: radial-gradient(circle, #000 10%, transparent 62%);
    animation: spin 40s linear infinite;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }
  .panel-prize.show .prize-glow { animation: spin 40s linear infinite, fade-in 1.2s ease .2s forwards; }

  .prize-card {
    position: relative;
    width: min(580px, 100%);
    padding: clamp(8px, 1.8vw, 14px);
    border-radius: 26px;
    background: linear-gradient(135deg, #fff6cf 0%, #f5c542 28%, #fff1a6 50%, #d4a017 76%, #fff2b8 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 90px rgba(255, 200, 40, .35);
    opacity: 0;
    overflow: hidden;
  }
  .prize-card img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 1;
    object-fit: cover;
    border-radius: 18px;
    background: #fff;
  }
  .prize-card::after {
    content: '';
    position: absolute;
    top: -20%;
    bottom: -20%;
    left: -60%;
    width: 35%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
    transform: skewX(-18deg);
    animation: btn-shine 4s ease-in-out 1.6s infinite;
  }
  .panel-prize.show .prize-card {
    animation: card-in 1.1s var(--ease-back) forwards, card-glow 2.6s ease-in-out 1.2s infinite alternate;
  }
  @keyframes card-in {
    0%   { opacity: 0; transform: perspective(900px) rotateY(85deg) scale(.55); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes card-glow {
    from { box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 70px rgba(255, 200, 40, .28); }
    to   { box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 120px rgba(255, 210, 60, .55); }
  }

  .congrats {
    font-family: 'El Messiri', 'Cairo', serif;
    font-size: clamp(3.4rem, 13vw, 6.5rem);
    font-weight: 700;
    line-height: 1.4;
    margin-top: 18px;
    opacity: 0;
  }
  .panel-prize.show .congrats { animation: title-in 1s var(--ease-back) .7s forwards, shine 3.5s linear 1.8s infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- shared SVG defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".35" stop-color="#f7cb45"/>
      <stop offset=".7" stop-color="#cf9516"/>
      <stop offset="1" stop-color="#f9d86c"/>
    </linearGradient>
    <linearGradient id="g-trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b7800f"/>
    </linearGradient>
    <clipPath id="cone-clip"><path d="M12 88 L43.6 19.6 L80.4 56.4 Z"/></clipPath>
    <symbol id="popper-shape" viewBox="0 0 100 100">
      <path d="M12 88 L43.6 19.6 L80.4 56.4 Z" fill="url(#g-gold)"/>
      <g clip-path="url(#cone-clip)" stroke="#a8720f" stroke-width="7" opacity=".5">
        <line x1="-3" y1="43" x2="57" y2="103"/>
        <line x1="9.5" y1="30.5" x2="69.5" y2="90.5"/>
        <line x1="22" y1="18" x2="82" y2="78"/>
      </g>
      <ellipse cx="62" cy="38" rx="26" ry="8" transform="rotate(45 62 38)" fill="#4a2f04"/>
      <ellipse cx="62" cy="38" rx="26" ry="8" transform="rotate(45 62 38)" fill="none" stroke="#fff1a6" stroke-width="2.5"/>
    </symbol>
  </defs>
</svg>

<div class="rays" id="rays"></div>
<canvas id="fx"></canvas>

<section class="intro" id="intro">
  <div class="beam beam-l"></div>
  <div class="beam beam-r"></div>
  <div class="burst"></div>
  <h1 class="intro-title gold-text">مبروك الفوز!</h1>
  <div class="popper popper-l" id="popperL">
    <svg viewBox="0 0 100 100"><use href="#popper-shape" width="100" height="100"/></svg>
  </div>
  <div class="popper popper-r" id="popperR">
    <svg viewBox="0 0 100 100"><g transform="translate(100 0) scale(-1 1)"><use href="#popper-shape" width="100" height="100"/></g></svg>
  </div>
</section>

<main class="stage" id="stage">
  <section class="panel panel-form" id="formPanel">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <path d="M19 12H10v4c0 7 4.5 11 10 11M45 12h9v4c0 7-4.5 11-10 11" fill="none" stroke="url(#g-trophy)" stroke-width="4" stroke-linecap="round"/>
        <path d="M18 7h28v15c0 8.5-6.3 15-14 15S18 30.5 18 22z" fill="url(#g-trophy)"/>
        <rect x="29" y="36" width="6" height="8" fill="url(#g-trophy)"/>
        <path d="M23 44h18l2.5 6h-23z" fill="url(#g-trophy)"/>
        <rect x="16" y="50" width="32" height="7" rx="2.5" fill="url(#g-trophy)"/>
        <path d="M32 13l1.8 3.7 4 .6-2.9 2.8.7 4L32 22.2l-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="#fffbe6" opacity=".9"/>
      </svg>
    </div>
    <h2 class="gold-text">مبروك الفوز!</h2>
    <p class="lead">أدخل بياناتك للكشف عن جائزتك</p>

    <form class="card" id="winnerForm" novalidate>
      <div class="field">
        <label for="studentId">Student ID</label>
        <input id="studentId" name="studentId" type="text" required maxlength="50" autocomplete="off" placeholder="أدخل الرقم الجامعي">
        <span class="err">هذا الحقل مطلوب</span>
      </div>
      <div class="field">
        <label for="studentName">Student Name</label>
        <input id="studentName" name="studentName" type="text" required maxlength="100" autocomplete="name" placeholder="أدخل اسمك الكامل">
        <span class="err">هذا الحقل مطلوب</span>
      </div>
      <button type="submit" class="btn" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnLabel">الكشف عن الجائزة</span>
      </button>
      <p class="form-error" id="formError" role="alert" hidden></p>
    </form>
  </section>

  <section class="panel panel-prize" id="prizePanel" hidden>
    <div class="prize-glow" aria-hidden="true"></div>
    <div class="prize-card" id="prizeCard">
      <img src="prize.webp" alt="الجائزة">
    </div>
    <h2 class="congrats gold-text">مبروك!</h2>
  </section>
</main>

<script>
(() => {
  // Google Apps Script web app that sends the email (code in google-apps-script/Code.gs)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1EGeMwoIYsxHpbk4CKcm5E9CLiWh-aCrzGRKbSBGMFyVg0F5WuTMusWpDEum1JEiPdQ/exec';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= particles (confetti + ambient sparkles) ================= */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const COLORS = [
    ['#ffe066', '#c99a1a'], ['#ffd700', '#b8860b'], ['#fff4cc', '#d9b54a'],
    ['#f5b82e', '#a8740c'], ['#ffeb99', '#c9a227'], ['#ffffff', '#e6c870']
  ];
  const confetti = [];
  let sparkles = [];
  let W = 0, H = 0, power = 1, rainUntil = 0, last = performance.now();

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    power = Math.max(.65, Math.min(1.35, Math.min(W, H) / 750));
    const count = Math.min(55, Math.round(W * H / 28000));
    sparkles = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1 + Math.random() * 2.2,
      vy: .1 + Math.random() * .25,
      phase: Math.random() * Math.PI * 2,
      speed: .0012 + Math.random() * .002,
      color: Math.random() < .5 ? '#ffe9a0' : '#ffd24a'
    }));
  }

  function makePiece(x, y, vx, vy) {
    const [color, shade] = COLORS[(Math.random() * COLORS.length) | 0];
    const roll = Math.random();
    return {
      x, y, vx, vy, color, shade,
      shape: roll < .5 ? 'rect' : roll < .8 ? 'strip' : 'circle',
      w: 7 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .3,
      tilt: Math.random() * Math.PI * 2,
      vt: .06 + Math.random() * .12,
      sway: .6 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2,
      g: .16 + Math.random() * .08,
      life: 0,
      ttl: 320 + Math.random() * 160
    };
  }

  function burst(x, y, angleDeg, count, spread = 24, boost = 1) {
    if (reduceMotion) return;
    for (let i = 0; i < count && confetti.length < 900; i++) {
      const a = (angleDeg + (Math.random() * 2 - 1) * spread) * Math.PI / 180;
      const speed = (11 + Math.random() * 13) * power * boost;
      confetti.push(makePiece(x, y, Math.cos(a) * speed, Math.sin(a) * speed));
    }
  }

  function rain(ms) {
    if (!reduceMotion) rainUntil = performance.now() + ms;
  }

  function star(x, y, r) {
    const R = r * 2.4;
    ctx.beginPath();
    ctx.moveTo(x, y - R);
    ctx.quadraticCurveTo(x, y, x + R, y);
    ctx.quadraticCurveTo(x, y, x, y + R);
    ctx.quadraticCurveTo(x, y, x - R, y);
    ctx.quadraticCurveTo(x, y, x, y - R);
    ctx.fill();
  }

  function frame(now) {
    const f = Math.min((now - last) / 16.667, 3);
    last = now;
    ctx.clearRect(0, 0, W, H);

    for (const s of sparkles) {
      s.y -= s.vy * f;
      if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
      const a = .7 * (.5 + .5 * Math.sin(now * s.speed + s.phase));
      if (a < .04) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.color;
      star(s.x, s.y, s.r);
    }

    if (now < rainUntil && confetti.length < 900) {
      const n = Math.max(1, Math.round(W / 420));
      for (let i = 0; i < n; i++) {
        confetti.push(makePiece(Math.random() * W, -20, (Math.random() - .5) * 2, 2 + Math.random() * 3));
      }
    }

    const airDrag = Math.pow(.955, f);
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vx *= airDrag;
      p.vy = p.vy * airDrag + p.g * f;
      p.life += f;
      p.x += (p.vx + Math.sin(p.life * .08 + p.phase) * p.sway) * f;
      p.y += p.vy * f;
      p.rot += p.vr * f;
      p.tilt += p.vt * f;
      if (p.y > H + 40 || p.life > p.ttl) { confetti.splice(i, 1); continue; }

      const flip = Math.cos(p.tilt);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, flip);
      ctx.globalAlpha = Math.min(1, (p.ttl - p.life) / 60);
      ctx.fillStyle = flip > 0 ? p.color : p.shade;
      if (p.shape === 'rect') ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      else if (p.shape === 'strip') ctx.fillRect(-1.5, -p.w, 3, p.w * 2);
      else { ctx.beginPath(); ctx.arc(0, 0, p.h / 1.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  /* ================= intro timeline ================= */
  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const rays = document.getElementById('rays');
  const popperL = document.getElementById('popperL');
  const popperR = document.getElementById('popperR');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function firePopper(el, left) {
    el.classList.remove('shake');
    el.classList.add('popped');
    const r = el.getBoundingClientRect();
    const x = r.left + r.width * (left ? .62 : .38);
    const y = r.top + r.height * .38;
    burst(x, y, left ? -58 : -122, 150, 22, 1.1);
  }

  async function playIntro() {
    await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), wait(1200)]);
    intro.classList.add('play');
    rays.classList.add('on');
    if (reduceMotion) {
      await wait(1400);
    } else {
      await wait(1150);
      popperL.classList.add('shake');
      popperR.classList.add('shake');
      await wait(350);
      firePopper(popperL, true);
      await wait(120);
      firePopper(popperR, false);
      rain(2200);
      await wait(2300);
    }
    intro.classList.add('leaving');
    await wait(650);
    intro.hidden = true;
    stage.classList.add('show');
  }
  playIntro();

  /* ================= form ================= */
  const form = document.getElementById('winnerForm');
  const idInput = document.getElementById('studentId');
  const nameInput = document.getElementById('studentName');
  const btn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const formError = document.getElementById('formError');
  const formPanel = document.getElementById('formPanel');
  const prizePanel = document.getElementById('prizePanel');
  const prizeCard = document.getElementById('prizeCard');
  const prizeImg = prizeCard.querySelector('img');
  let busy = false;

  [idInput, nameInput].forEach(input => {
    input.addEventListener('input', () => input.closest('.field').classList.remove('invalid'));
  });

  function setBusy(on) {
    busy = on;
    btn.disabled = on;
    btn.classList.toggle('busy', on);
    btnLabel.textContent = on ? 'جاري الكشف...' : 'الكشف عن الجائزة';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;

    let firstBad = null;
    for (const input of [idInput, nameInput]) {
      const bad = !input.value.trim();
      input.closest('.field').classList.toggle('invalid', bad);
      if (bad && !firstBad) firstBad = input;
    }
    if (firstBad) {
      firstBad.focus();
      form.classList.remove('shake-x');
      void form.offsetWidth;
      form.classList.add('shake-x');
      return;
    }

    formError.hidden = true;
    setBusy(true);
    try {
      // No custom headers: keeps this a "simple" CORS request, which Apps Script accepts.
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ studentId: idInput.value.trim(), name: nameInput.value.trim() })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || 'request failed');
      try { await prizeImg.decode(); } catch (_) { /* show anyway */ }
      reveal();
    } catch (err) {
      formError.textContent = 'تعذّر إرسال البيانات، يرجى المحاولة مرة أخرى.';
      formError.hidden = false;
      setBusy(false);
    }
  });

  async function reveal() {
    formPanel.classList.add('leaving');
    await wait(450);
    formPanel.hidden = true;
    prizePanel.hidden = false;
    void prizePanel.offsetWidth;
    prizePanel.classList.add('show');
    scrollTo({ top: 0 });
    await wait(500);
    burst(16, H - 16, -62, 140, 18, 1.25);
    burst(W - 16, H - 16, -118, 140, 18, 1.25);
    const r = prizeCard.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, -90, 90, 180, .8);
    rain(2600);
  }
})();
</script>
</body>
</html>
